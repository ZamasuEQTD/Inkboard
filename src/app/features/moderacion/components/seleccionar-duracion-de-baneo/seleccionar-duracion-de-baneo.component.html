<app-dialog  [fullScreenOnMobile]="false" title="Seleccionar duración" (onClose)="this.dialogRef.close()">
    @for (duration of durations; track $index) {
        <div class="px-5 py-2 hover:bg-gray-200 hover:rounded-md" (click)="this.data.onDuracionSeleccionada($index)">
            <span class="font-semibold">{{duration}}</span>
        </div>
    }
</app-dialog>
