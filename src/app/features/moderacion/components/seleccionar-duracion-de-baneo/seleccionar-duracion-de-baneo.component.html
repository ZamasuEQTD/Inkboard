<app-dialog [(visible)]="this.visible" [fullScreenOnMobile]="false" title="Seleccionar duración">
    @for (duration of durations; track $index) {
        <div class="px-5 py-2 hover:bg-gray-200 hover:rounded-md" (click)="this.visible.set(false);this.onDuracionSeleccionada.emit($index)">
            <span class="font-semibold">{{duration}}</span>
        </div>
    }
</app-dialog>
