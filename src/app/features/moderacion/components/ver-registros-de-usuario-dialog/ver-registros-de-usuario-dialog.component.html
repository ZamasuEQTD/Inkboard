<app-dialog [fullScreenOnMobile]="false" (onClose)="this.dialogRef.close()">
    <div class="flex justify-center bg-input/60 rounded-lg mb-1 p-2 w-full">
        <div class="p-2 flex flex-row gap-x-2">

            <div class="size-12 bg-white rounded-full flex justify-center items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>

            <div class="flex-1 flex flex-col">

                @let usuario = this.usuario();

                @if (usuario) {
                    <span class="font-semibold">{{usuario.straff_name ?? 'Anonimo'}}</span>
                    <span class="text-xs">Unido desde {{usuario.registrado_en | date:'dd/MM/yyyy'}}</span>
                } @else {

                }
            </div>

        </div>
    </div>

    <button class="text-button danger-button" (click)="mostrarBanearUsuario()">Banear usuario</button>

    <div class="flex flex-row rounded-lg p-2 mt-1">
        <button class="secondary-button text-button" (click)="this.seleccionarRegistro('hilos')" [class]="{'bg-white!' : this.registroSeleccionado() === 'hilos'}">
            <i class="fa-regular fa-note-sticky"></i>
            <span>Hilos</span>
        </button>

        <button class="secondary-button text-button" (click)="this.seleccionarRegistro('comentarios')"  [class]="{'bg-white' : this.registroSeleccionado() === 'comentarios'}">
            <i class="fa-regular fa-message"></i>
            <span>Comentarios</span>
        </button>
  </div>

  @for (registro of this.registros(); track $index) {
    <app-registro-de-usuario [registro]="registro" [tipo]="this.registroSeleccionado()"></app-registro-de-usuario>
  }
  
</app-dialog>
