<div class="flex flex-col justify-between h-full">
    <div class="sm:overflow-y-auto" cdk-scrollable>
        <div class="my-2 px-2">
            @if(cargandoHilo()){
                <div class="w-[250px] h-[20px] rounded bg-skeleton"></div>
            }@else {
                <span class="text-2xl font-bold">Comentarios ({{ hilo()?.cantidad_comentarios }})</span>
            }
        </div>
    
        <comentarios-list [comentarios]="comentarios()" [cargandoComentarios]="cargandoComentarios()"/>

    </div>

    <comentar-hilo class="hidden sm:block"/>
</div>
