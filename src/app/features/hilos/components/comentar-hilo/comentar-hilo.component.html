
<div class="px-2 py-2 border-solid border-t-[1px] border-gray-400/20">
    <form action="" [formGroup]="this.form">

        <app-pick-file (onPickedFile)="agregarArchivo($event)" #filePicker /> 

        @if(pickedFiles.length !== 0){
            <div class="flex flex-row gap-x-1 pt-1 mb-1">
                @for (file of this.pickedFiles; track $index) {
                   <div class="relative">
                    <div class="relative  rounded-md overflow-hidden">

                        <div class="size-30">
                    
                            <app-picked-media-thumbnail class="h-full" [media]="file" />
                            
                            @if (file.spoiler) {
                                <div class="absolute w-full h-full  top-0 right-0 bg-black-100 bg-opacity-20 backdrop-blur-lg rounded-md"></div>
                            }
        
                        </div>
                    
                    </div>

                    <div class="absolute top-[-5px] right-[-10px] border-solid bg-white border-gray-600/40 border-[1px] rounded-sm flex flex-row">
                        <button class="size-8 flex justify-center items-center" (click)="file.spoiler = !file.spoiler" type="button">   
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye size-5"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>

                        <button class="size-8 flex justify-center items-center" (click)="eliminarArchivo($index)">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2 size-5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>                        
                        </button>
                    </div>
                   </div>
                }
            </div>
        }

        <div class="flex flex-row gap-x-2 items-center ">

            <div class="relative flex-1">
                <textarea 
                    rows="3" 
                    name="" 
                    id=""
                    #comentarioTextarea
                    placeholder="Escribe tu comentario" 
                    class="pl-10 pr-1 w-full"
                    [formControl]="textoControl"
                    [value]="form.value.texto"
                ></textarea>

              <button class="absolute top-1 left-0 size-10 flex justify-center items-center" (click)="filePicker.pick()" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-bolt">
                  <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                  <circle cx="12" cy="12" r="4" />
                </svg>
              </button>
            </div>

            <button class="icon-button p-2 grow-0 size-10 flex items-center justify-center" (click)="$event" type="submit">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
                <path
                  d="M3.105 2.288a.75.75 0 0 0-.826.95l1.414 4.926A1.5 1.5 0 0 0 5.135 9.25h6.115a.75.75 0 0 1 0 1.5H5.135a1.5 1.5 0 0 0-1.442 1.086l-1.414 4.926a.75.75 0 0 0 .826.95 28.897 28.897 0 0 0 15.293-7.155.75.75 0 0 0 0-1.114A28.897 28.897 0 0 0 3.105 2.288Z" />
              </svg>
            </button>

          </div>
    </form>
</div>
