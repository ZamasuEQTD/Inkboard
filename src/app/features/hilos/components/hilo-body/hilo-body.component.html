@let hilo = this.hilo();

@if(hilo){

<div class="flex flex-col px-1 py-1 bg-background-base h-full sm:overflow-y-auto rounded-b-2xl sm:rounded-none">

  <div class="flex px-2 py-1 gap-x-1 bg-white rounded-md items-center mb-1">
      <img class="size-[40px] object-cover rounded" [src]="hilo!.subcategoria.imagen" alt="" />
      <a routerLink="/" class="font-semibold text-sm text-blue-700"><span>{{hilo!.subcategoria.nombre}}</span></a>
  </div>

  <div class="flex flex-row justify-between px-2 py-1 bg-white rounded-md">
      
      <div class="flex flex-row gap-x-1">
          <button class="hilo-icon-feature">
            <i class="fa-regular fa-flag"></i>
          </button>

          <button class="hilo-icon-feature">
            <i class="fa-regular fa-star"></i>
          </button>

          <button class="hilo-icon-feature">
            <i class="fa-regular fa-eye"></i>
          </button>

          <button class="hilo-icon-feature">
            <i class="fa-solid fa-user-plus"></i>
          </button>
      </div>
      

      <div class="flex flex-row gap-x-1 items-center">
          <span class="font-bold text-sm">{{hilo!.autor}}</span>

          <div class="px-1 py-[0.125rem] bg-gray-400 flex items-center justify-center rounded-md">
            <span class="text-xs font-semibold text-white">{{hilo!.autor_role | autorRole}}</span>
          </div>

          <span class="text-xs font-semibold text-gray-400">{{hilo!.created_at | tiempoTranscurrido}}</span>
        </div>
  </div>

  <div class="flex justify-center my-1">
      <div class="overflow-hidden rounded-md">
          <app-media-box 
                  [dimensionbleOptions]="{size: {maxHeight : '500px'}}"
                  [media]="hilo?.media!">
              <app-blur-advertencia 
                  class="top-0
                      size-full
                      absolute"
                  [(spoiler)]="hilo!.media.spoiler"
                  dimensionable
              />
          </app-media-box>
      </div>
  </div>

  <span class="text-2xl font-bold break-words">{{hilo?.titulo}}</span>

  <span class="break-words">{{hilo?.descripcion}}</span>
</div>
}
