<div class="h-screen flex flex-col">
    <app-header></app-header>

    <div class="grow-1 flex flex-col justify-between overflow-hidden"> 
        <div class="
            grow
            flex 
            flex-col 
            sm:flex-row
            sm:w-full
            sm:h-full
            overflow-y-auto
            sm:overflow-y-hidden
        "

        cdk-scrollable
        >

        <hilo-body 
            class="
            w-full
            sm:w-[45%]
            "
            [hilo]="hilo"
            [cargando]="this.cargandoHilo"
        />
    
        <hilo-comentarios 
            class="sm:w-[55%]"
            [hilo]="hilo" 
            [cargandoHilo]="this.cargandoHilo"
            [cargandoComentarios]=" cargandoComentarios" 
            [comentarios]="comentarios"
        />
    </div>
    
    <comentar-hilo class="sm:hidden" />  
    </div>


</div>


@if (this.service.hayHistorialDeComentarios) {
    <div class="bg-black/15 absolute top-0 left-0 right-0 bottom-0 z-[1000]" (cancel)="this.service.setHistorialFromTags([])"></div>
    <app-dialog [fullScreenOnMobile]="false" (onClose)="this.service.setHistorialFromTags([])">
        <div class="flex flex-col gap-y-1">
            @for(comentario of this.service.historialDeComentariosSeleccionado(); track $index) {
                <app-comentario  [comentario]="comentario"  /> 
            }
        </div>
    </app-dialog>
}


@if(this.service.usuarioSeleccionado()){
    <app-ver-registros-de-usuario-dialog [id]="this.service.usuarioSeleccionado()!" (onClose)="this.service.usuarioSeleccionado.set(undefined)" />
}
