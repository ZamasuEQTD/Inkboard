<div class="h-screen flex flex-col">
    <app-header class="sticky top-0"></app-header>

    <div class="grow-1 flex flex-col justify-between overflow-hidden"> 
        <div class="
            grow
            flex 
            flex-col 
            sm:flex-row
            sm:w-full
            sm:h-full
            overflow-y-auto
            sm:overflow-y-hidden
        "
        >

        <hilo-body 
            class="
            w-full
            sm:w-[45%]
            "
            [hilo]="hilo"
        />
    
        <hilo-comentarios 
            class="sm:w-[55%]"
            [hilo]="hilo" 
            [cargandoComentarios]="cargandoHilo || cargandoComentarios" 
            [comentarios]="comentarios"
        />
    </div>
    
    <comentar-hilo class="sm:hidden" />  
    </div>


</div>


@if (this.service.hayHistorialDeComentarios) {
    <div class="absolute top-0 bottom-0 right-0 left-0 bg-black/10" (click)="service.historialDeComentariosSeleccionado.set([])"></div>
    <div class=" bg-white px-2 py-1 rounded-t-xl  w-full bottom-0 fixed max-h-[40vh] overflow-y-scroll">
        <div class="flex flex-col gap-y-1">
            @for (comentario of this.service.historialDeComentariosSeleccionado(); track $index) {
                <app-comentario  [comentario]="comentario" /> 
            }
        </div>
    </div>
}
