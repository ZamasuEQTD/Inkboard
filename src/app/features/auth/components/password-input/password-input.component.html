<div class="relative">
    <input 
        maxlength="16"
        class="pr-11 w-full"
        [type]="visible()? 'text' : 'password'" 
        [formControl]="control()"
        >
    
    <button class="absolute h-full w-10 right-0 text-[oklab(0.322425_0.00154591_-0.010555)]" (click)="toggleVisible()">
        @if(visible()) {
            <i class="fa-solid fa-eye-slash"></i>
        } @else {
            <i class="fa-solid fa-eye"></i>
        }
    </button>
</div>
