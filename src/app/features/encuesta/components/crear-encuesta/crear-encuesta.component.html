@if(encuesta().length !== 0){
        @for (item of encuesta().controls; track $index) {
            <div class="flex flex-row gap-x-2 mb-2">
                <input [formControl]="item" type="text" [placeholder]="'Opcion ' + ($index + 1)" class="w-full ">
        
                <button class="size-10 flex justify-center items-center icon-button destructive-icon-button"  (click)="eliminarOpcion($index)">
                    <i class="fas fa-trash "></i>
                </button>
            </div>
        }
    
    @if(encuesta().length != 4){
        <button class="secondary-button text-button" (click)="agregarOpcion()">
            <span>Agregar opción</span>
        </button>
    }
}@else{
    <button class="secondary-button text-button" (click)="agregarOpcion()">
        <i class="fas fa-poll"></i>
        <span>Agregar encuesta</span>    
    </button>
}
