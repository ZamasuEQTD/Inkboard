<form  action="" [formGroup]="this.form">
    <div class=" flex flex-row gap-x-0.5 justify-center">
  
    <input type="text" [value]="form.value.titulo" [formControl]="this.form.controls.titulo" placeholder="Titulo" class="bg-white rounded-xl w-full sm:w-auto">
            
    <button class="p-2 secondary-button icon-button size-10" (click)="this.mostrarSubcategorias()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-box-icon lucide-box">
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                <path d="m3.3 7 8.7 5 8.7-5"/>
                <path d="M12 22V12"/>
        </svg>
    </button>

    <button class="p-2 secondary-button icon-button size-10 shrink-0 flex justify-center items-center"(click)="buscarHilos()">
        <i class="fas fa-search"></i>
    </button>
 
</div>
</form>
