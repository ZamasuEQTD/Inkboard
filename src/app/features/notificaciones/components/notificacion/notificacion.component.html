@let notificacion = this.notificacion();
<div class="cursor-pointer px-4 py-2 flex flex-col  hover:bg-background-base" (click)="onTap.emit()">
  <div class="flex flex-row">

    <img [src]="notificacion.hilo.portada" alt="" class="size-12 rounded-lg object-cover">

    <div class="flex flex-col ml-4">
      <span class="font-semibold text-sm">{{tipo}}</span>
      <span class="text-xs">
        <span >{{notificacion.hilo.titulo}}</span>
        @if(notificacion.comentario_respondido_tag){
          <span class="font-medium"> › {{notificacion.comentario_respondido_tag}}</span>
        }
      </span>
    </div>
  </div>

  <span class="text-sm line-clamp-3 break-words">{{notificacion.contenido}}</span>

  <span class="text-xs text-light-muted">Hace {{ this.notificacion().fecha | tiempoTranscurrido }}</span>
</div>
